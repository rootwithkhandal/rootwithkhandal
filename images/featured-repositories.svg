<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240" fill="none">
  <defs>
    <style>
      .mono-label { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 11px; fill: #6D7482; letter-spacing: 0.08em; text-transform: uppercase; }
      .repo-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #ECEEF2; }
      .repo-desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; line-height: 1.55; fill: #A4ABB8; }
      .repo-stack { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 10.5px; fill: #6D7482; }
      .tag-def { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #8FB996; text-anchor: end; }
      .tag-intel { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #9BB7D4; text-anchor: end; }
      .tag-endp { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #DEC08B; text-anchor: end; }
      .tag-recon { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #DE8F8F; text-anchor: end; }
    </style>
  </defs>

  <text x="0" y="14" class="mono-label">▪ FEATURED ENGINEERING ARTIFACTS</text>

  <!-- Row 1 -->
  <!-- Card 1: Blackwall -->
  <rect x="0" y="24" width="438" height="98" fill="#181A1F" stroke="#2B2F38" stroke-width="1" rx="3" />
  <text x="18" y="48" class="repo-title">Blackwall</text>
  <text x="420" y="48" class="tag-def">Defensive SOC</text>
  <text x="18" y="70" class="repo-desc">Localized Linux SOC system featuring Scapy packet capture, rule-</text>
  <text x="18" y="86" class="repo-desc">based + ML anomaly detection, and a Streamlit dashboard.</text>
  <text x="18" y="108" class="repo-stack">Python · Scapy · Streamlit · Scikit-learn</text>

  <!-- Card 2: ThreatGrid -->
  <rect x="462" y="24" width="438" height="98" fill="#181A1F" stroke="#2B2F38" stroke-width="1" rx="3" />
  <text x="480" y="48" class="repo-title">ThreatGrid</text>
  <text x="882" y="48" class="tag-intel">Threat Intel</text>
  <text x="480" y="70" class="repo-desc">Real-time threat map and vulnerability digest engine compiled as a</text>
  <text x="480" y="86" class="repo-desc">single binary with zero external runtime dependencies.</text>
  <text x="480" y="108" class="repo-stack">Go · Zero-dependency single binary</text>

  <!-- Row 2 -->
  <!-- Card 3: HookShield -->
  <rect x="0" y="134" width="438" height="98" fill="#181A1F" stroke="#2B2F38" stroke-width="1" rx="3" />
  <text x="18" y="158" class="repo-title">HookShield</text>
  <text x="420" y="158" class="tag-endp">Endpoint Detection</text>
  <text x="18" y="180" class="repo-desc">Real-time endpoint detection agent monitoring running processes,</text>
  <text x="18" y="196" class="repo-desc">file hashes, keyboard hooks, network sockets, and persistence.</text>
  <text x="18" y="218" class="repo-stack">Python · OS Hooks · CLI · Web Dashboard</text>

  <!-- Card 4: ReconSmith -->
  <rect x="462" y="134" width="438" height="98" fill="#181A1F" stroke="#2B2F38" stroke-width="1" rx="3" />
  <text x="480" y="158" class="repo-title">ReconSmith</text>
  <text x="882" y="158" class="tag-recon">Offensive Recon</text>
  <text x="480" y="180" class="repo-desc">Automated reconnaissance pipeline integrating Subfinder, Httpx,</text>
  <text x="480" y="196" class="repo-desc">and Nuclei for continuous, deterministic attack surface discovery.</text>
  <text x="480" y="218" class="repo-stack">Bash · Python · Go Tooling</text>
</svg>
