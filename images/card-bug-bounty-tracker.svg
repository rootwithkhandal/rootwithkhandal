<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 105" width="100%" height="105" fill="none">
  <defs>
    <style>
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #ECEEF2; }
      .tag { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 11px; fill: #DE8F8F; text-anchor: end; }
      .desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #A4ABB8; }
      .stack { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 10.5px; fill: #6D7482; }
      .arrow { font-size: 12px; fill: #6D7482; }
    </style>
  </defs>
  <rect width="430" height="105" fill="#181A1F" stroke="#2B2F38" stroke-width="1" rx="3" />
  <text x="18" y="28" class="title">Bug Bounty Tracker <tspan class="arrow">↗</tspan></text>
  <text x="412" y="28" class="tag">Bounty Operations</text>
  <text x="18" y="52" class="desc">Local-first CLI and terminal dashboard utility for multi-platform</text>
  <text x="18" y="68" class="desc">submission tracking, scope verification, and yield analytics.</text>
  <text x="18" y="90" class="stack">Python · SQLite · Rich · CLI</text>
</svg>
