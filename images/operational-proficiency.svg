<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 175" width="100%" height="175" fill="none">
  <defs>
    <style>
      .mono-label { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 11px; fill: #6D7482; letter-spacing: 0.08em; text-transform: uppercase; }
      .bar-label { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 13px; fill: #A4ABB8; }
      .bar-val { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 13px; fill: #6D7482; text-anchor: end; }
      .track { fill: #2B2F38; rx: 1.5px; }
      .fill { fill: #9BB7D4; rx: 1.5px; }
    </style>
  </defs>

  <text x="0" y="14" class="mono-label">▪ OPERATIONAL PROFICIENCY</text>
  <rect x="0" y="24" width="900" height="150" fill="#181A1F" stroke="#2B2F38" stroke-width="1" rx="3" />

  <!-- Row 1: SOC / Blue (85%) -->
  <text x="24" y="58" class="bar-label">SOC / Blue</text>
  <rect x="170" y="53" width="640" height="3" class="track" />
  <rect x="170" y="53" width="544" height="3" class="fill" />
  <text x="876" y="58" class="bar-val">85%</text>

  <!-- Row 2: AI / MLSec (75%) -->
  <text x="24" y="90" class="bar-label">AI / MLSec</text>
  <rect x="170" y="85" width="640" height="3" class="track" />
  <rect x="170" y="85" width="480" height="3" class="fill" />
  <text x="876" y="90" class="bar-val">75%</text>

  <!-- Row 3: Blockchain (80%) -->
  <text x="24" y="122" class="bar-label">Blockchain</text>
  <rect x="170" y="117" width="640" height="3" class="track" />
  <rect x="170" y="117" width="512" height="3" class="fill" />
  <text x="876" y="122" class="bar-val">80%</text>

  <!-- Row 4: Offensive (65%) -->
  <text x="24" y="154" class="bar-label">Offensive</text>
  <rect x="170" y="149" width="640" height="3" class="track" />
  <rect x="170" y="149" width="416" height="3" class="fill" />
  <text x="876" y="154" class="bar-val">65%</text>
</svg>
