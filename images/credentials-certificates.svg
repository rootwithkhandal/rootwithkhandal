  <!-- Card 6: MICROSOFT / PYRIT -->
  <rect x="612" y="104" width="288" height="68" fill="#181A1F" stroke="#2B2F38" stroke-width="1" rx="3" />
  <text x="628" y="124" class="meta-text">MICROSOFT / PYRIT : 2025</text>
