  <text x="884" y="44" class="arrow">↗</text>
  <text x="628" y="68" class="cert-title">Cybersecurity 101</text>

  <!-- Row 2 -->
  <!-- Card 4: NVIDIA -->
  <rect x="0" y="104" width="288" height="68" fill="#181A1F" stroke="#2B2F38" stroke-width="1" rx="3" />
  <text x="16" y="124" class="meta-text">NVIDIA : 2025</text>
  <text x="272" y="124" class="arrow">↗</text>
  <text x="16" y="148" class="cert-title">AI for Anomaly Detection</text>

  <!-- Card 5: IMMUNEFI -->
  <rect x="306" y="104" width="288" height="68" fill="#181A1F" stroke="#2B2F38" stroke-width="1" rx="3" />
  <text x="322" y="124" class="meta-text">IMMUNEFI : 2025</text>
  <text x="578" y="124" class="arrow">↗</text>
