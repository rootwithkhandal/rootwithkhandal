<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180" fill="none">
  <defs>
    <style>
      .mono-label { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 11px; fill: #6D7482; letter-spacing: 0.08em; text-transform: uppercase; }
      .meta-text { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 10.5px; fill: #6D7482; }
      .arrow { font-family: 'Inter', sans-serif; font-size: 12px; fill: #6D7482; text-anchor: end; }
      .cert-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #ECEEF2; }
    </style>
  </defs>

  <text x="0" y="14" class="mono-label">▪ CREDENTIALS AND CERTIFICATES</text>

  <!-- Row 1 -->
  <!-- Card 1: EC-COUNCIL -->
  <rect x="0" y="24" width="288" height="68" fill="#181A1F" stroke="#2B2F38" stroke-width="1" rx="3" />
  <text x="16" y="44" class="meta-text">EC-COUNCIL : 2026</text>
  <text x="272" y="44" class="arrow">↗</text>
  <text x="16" y="68" class="cert-title">Certified SOC Analyst (CSA)</text>

  <!-- Card 2: IBM / COURSERA -->
  <rect x="306" y="24" width="288" height="68" fill="#181A1F" stroke="#2B2F38" stroke-width="1" rx="3" />
