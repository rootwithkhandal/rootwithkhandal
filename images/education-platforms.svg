<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160" fill="none">
  <defs>
    <style>
      .mono-label { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 11px; fill: #6D7482; letter-spacing: 0.08em; text-transform: uppercase; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #ECEEF2; }
      .prop-label { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 11px; fill: #6D7482; }
      .prop-val { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #A4ABB8; }
      .chip-text { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 11px; fill: #A4ABB8; }
      .badge-text-blue { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #9BB7D4; letter-spacing: 0.05em; text-anchor: middle; }
      .badge-text-green { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #8FB996; letter-spacing: 0.05em; text-anchor: middle; }
    </style>
  </defs>

  <!-- Left: Education -->
  <text x="0" y="14" class="mono-label">▪ EDUCATION</text>
  <rect x="0" y="24" width="438" height="136" fill="#181A1F" stroke="#2B2F38" stroke-width="1" rx="3" />

  <text x="20" y="54" class="card-title">Master of Computer Applications</text>
  <rect x="350" y="40" width="70" height="20" fill="#182230" stroke="#2C3E57" stroke-width="1" rx="2" />
  <text x="385" y="54" class="badge-text-blue">PURSUING</text>

  <text x="20" y="96" class="prop-label">STATUS</text>
  <text x="84" y="96" class="prop-val">Active Student</text>

  <text x="20" y="124" class="prop-label">FOCUS</text>
  <text x="84" y="124" class="prop-val">Cyber Security and AI Safety</text>

  <!-- Right: Certifications & Platforms -->
  <text x="462" y="14" class="mono-label">▪ CERTIFICATIONS AND PLATFORMS</text>
  <rect x="462" y="24" width="438" height="136" fill="#181A1F" stroke="#2B2F38" stroke-width="1" rx="3" />

  <text x="482" y="54" class="card-title">Bug Bounty : SOC Operations</text>
  <rect x="826" y="40" width="56" height="20" fill="#16241B" stroke="#26422F" stroke-width="1" rx="2" />
  <text x="854" y="54" class="badge-text-green">ACTIVE</text>

  <!-- Platform Chips Row 1 -->
  <rect x="482" y="80" width="160" height="24" fill="#121316" stroke="#2B2F38" stroke-width="1" rx="2" />
  <text x="492" y="96" class="chip-text">Certified SOC Analyst</text>

  <rect x="650" y="80" width="88" height="24" fill="#121316" stroke="#2B2F38" stroke-width="1" rx="2" />
  <text x="660" y="96" class="chip-text">Code4rena</text>

  <!-- Platform Chips Row 2 -->
  <rect x="482" y="112" width="76" height="24" fill="#121316" stroke="#2B2F38" stroke-width="1" rx="2" />
  <text x="492" y="128" class="chip-text">Sherlock</text>

  <rect x="566" y="112" width="88" height="24" fill="#121316" stroke="#2B2F38" stroke-width="1" rx="2" />
  <text x="576" y="128" class="chip-text">TryHackMe</text>

  <rect x="662" y="112" width="92" height="24" fill="#121316" stroke="#2B2F38" stroke-width="1" rx="2" />
  <text x="672" y="128" class="chip-text">HackTheBox</text>
</svg>
